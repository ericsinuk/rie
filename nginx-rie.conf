# Drop this into your existing dhl-audit.duckdns.org server block,
# or include it from the main nginx config.
# Assumes the built frontend is at /var/www/dhl-audit/rie/dist
# and the Express server runs on port 5555.

location /rie/api/ {
    proxy_pass http://127.0.0.1:5555/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # WebSocket upgrade support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
}

location /rie/ {
    alias /var/www/dhl-audit/rie/dist/;
    try_files $uri $uri/ /rie/index.html;
}
